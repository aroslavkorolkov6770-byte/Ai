  <script id="research-data" type="application/json">[{"id":1,"name":"Adot AI","category":"Работа","visual":"Светлый экран заметок: узкая полоса разделов, список слева, основная область справа.","feature":"Отдельные разделы поиска и заметок; создание заметки из записи заявлено на открытом экране.","idea":"Сохранять полезный итог диалога отдельной заметкой; позже добавить расшифровку голосовых заметок.","evidence":"Открытый экран заметок; без входа","source":"https://adot.ai/note/list","priority":"P1"},{"id":2,"name":"Candy Network","category":"Персонажи","visual":"По текстовой структуре страницы: каталог, чат, создание персонажа и личная коллекция. Цвета и закрытый чат не проверены.","feature":"Официальное описание заявляет настройку профиля и характера виртуального собеседника.","idea":"Гипотеза для делового помощника: отдельно настраивать имя и стиль общения. Тематику сервиса не переносить.","evidence":"Только публичное текстовое описание","source":"https://a16z.com/100-gen-ai-apps-6/","sourceLabel":"Источник включения в выборку","priority":"P2"},{"id":3,"name":"Canva","category":"Медиа","visual":"Яркий градиентный первый экран, крупный заголовок и категории создаваемого контента.","feature":"Шаблоны и ИИ-инструменты для дизайна, документов, изображений и видео.","idea":"Начинать задачу с понятной карточки результата: план, инструкция, конспект; добавить библиотеку своих шаблонов.","evidence":"Официальная витрина и перечень функций","source":"https://www.canva.com/","priority":"P1"},{"id":4,"name":"CapCut","category":"Медиа","visual":"Контрастная большая типографика и одна заметная кнопка запуска редактора.","feature":"Редактирование фото и видео с ИИ; продуктовые разделы и шаблоны представлены на сайте.","idea":"Один главный следующий шаг на каждом экране. Для LMS позже — отдельный сценарий работы с учебным видео.","evidence":"Публичная главная; редактор не тестировался","source":"https://www.capcut.com/","priority":"P2"},{"id":5,"name":"Character.ai","category":"Персонажи","visual":"Светлая страница входа с одним блоком регистрации; внутренний каталог закрыт.","feature":"На открытом экране заявлен доступ к каталогу персонажей; диалоги не тестировались.","idea":"Гипотеза: библиотека деловых ролей — наставник, редактор, помощник по обучению; никаких обещаний человеческих чувств.","evidence":"Только экран входа","source":"https://character.ai/","priority":"P2"},{"id":6,"name":"ChatGPT","category":"Ассистенты","visual":"Нейтральный светлый фон, боковая навигация и центральная строка ввода; дополнительные действия спрятаны рядом с ней.","feature":"Чат, вложения и диктовка видны в интерфейсе; организация чатов и материалов по проектам описана в документации.","idea":"Сохранить простой центр общения, историю и материалы проекта; добавлять сложные функции постепенно.","evidence":"Открытый чат + официальная документация","source":"https://learn.chatgpt.com/docs/projects","priority":"P0"},{"id":7,"name":"Civitai","category":"Медиа","visual":"Не оценён: просмотр сайта заблокирован политикой браузерного инструмента.","feature":"Присутствие в выборке подтверждено; актуальные функции лично не проверены.","idea":"Не брать конкретные UX-решения без проверки. Независимая идея для нас: паспорт собственной модели с данными и ограничениями.","evidence":"Ограничение доступа; только список a16z","source":"https://a16z.com/100-gen-ai-apps-6/","sourceLabel":"Источник включения в выборку","priority":"HOLD"},{"id":8,"name":"Claude","category":"Ассистенты","visual":"Тёплый светлый фон, спокойная типографика и сгруппированные сценарии работы на официальной витрине.","feature":"Projects, редактируемые результаты, Artifacts и управление разрешениями описаны на странице продукта.","idea":"Показывать документ или план отдельно от переписки и сохранять версии результата.","evidence":"Официальная витрина и документация возможностей","source":"https://claude.com/product/overview","priority":"P1"},{"id":9,"name":"CrushOn","category":"Персонажи","visual":"Не оценён: получены только название и минимальные метаданные страницы.","feature":"Название страницы указывает на персонажные чаты; настройка и качество памяти не подтверждены.","idea":"Не включать конкретные функции в план на основании неполной проверки.","evidence":"Минимальные метаданные; UX не проверен","source":"https://a16z.com/100-gen-ai-apps-6/","sourceLabel":"Источник включения в выборку","priority":"HOLD"},{"id":10,"name":"Cursor","category":"Работа","visual":"На официальном демо список задач слева, диалог в центре и предпросмотр результата справа.","feature":"Работа агента над кодом; задачи разделены на выполняемые и готовые к проверке.","idea":"Показывать этапы эксперимента и отдельную очередь результатов, ожидающих проверки человеком.","evidence":"Официальная интерактивная демонстрация","source":"https://cursor.com/","priority":"P1"},{"id":11,"name":"Cutout","category":"Медиа","visual":"Каталог инструментов с левой панелью, карточками популярных действий и фильтрами.","feature":"Инструменты редактирования изображений и создания видео; отдельный вход в API.","idea":"Объединять небольшие инструменты по задачам пользователя, а API оставлять отдельным разделом.","evidence":"Открытая витрина инструментов","source":"https://www.cutout.pro/","priority":"P1"},{"id":12,"name":"DeepSeek","category":"Ассистенты","visual":"Крупное поле ввода, сдержанный голубой акцент; режимы DeepThink и Search доступны рядом.","feature":"На стартовом экране разделены разговор, поиск, API и настольный инструмент.","idea":"Явно показывать режим ответа и доступность поиска. Не создавать впечатление интернета у локальной модели без такого инструмента.","evidence":"Публичный стартовый экран","source":"https://deepseek.com/","priority":"P0"},{"id":13,"name":"Doubao","category":"Ассистенты","visual":"До регионального ограничения видна боковая панель с отдельными действиями для разговора и рабочей задачи.","feature":"Разговор и рабочие задачи представлены раздельно. Дальнейшие функции недоступны без входа в этой сессии.","idea":"Развести свободный разговор и задачу с ожидаемым результатом.","evidence":"Частичный экран; региональное ограничение","source":"https://www.doubao.com/chat/","priority":"P1"},{"id":14,"name":"ElevenLabs","category":"Медиа","visual":"Чистый светлый интерфейс, вкладки платформ и отдельные переключатели голосовых сценариев.","feature":"Озвучка, распознавание речи и выбор голоса; на витрине доступны карточки предпрослушивания.","idea":"При подключении голоса дать выбор и прослушивание образца, явные кнопки остановки и состояния микрофона.","evidence":"Официальная витрина и демо-контролы","source":"https://elevenlabs.io/","priority":"P2"},{"id":15,"name":"Freepik / Magnific","category":"Медиа","visual":"Насыщенная полноэкранная визуальная витрина с каталогом творческих процессов.","feature":"Адрес Freepik сейчас перенаправляет на Magnific; заявлены изображения, видео, аудио и рабочие процессы.","idea":"Сохранённые цепочки действий для повторяющихся задач. Не переносить обилие рекламных блоков в рабочее окно.","evidence":"Официальная витрина; замечено переименование","source":"https://www.magnific.com/","priority":"P2"},{"id":16,"name":"Gamma","category":"Работа","visual":"Крупный заголовок и готовые примеры презентаций рядом; сценарий разделён на создание, редактирование и экспорт.","feature":"Создание презентаций, документов и сайтов; экспорт в распространённые форматы заявлен на странице.","idea":"Выбирать формат результата заранее и давать понятную кнопку экспорта.","evidence":"Официальная витрина и примеры результатов","source":"https://gamma.app/","priority":"P1"},{"id":17,"name":"Gemini","category":"Ассистенты","visual":"Светлая визуальная система официального обзора с голубым акцентом. Рабочий экран приложения не проверен: появилась проверка подозрительного трафика.","feature":"Официальный обзор описывает универсального помощника и работу с разными типами информации.","idea":"Одно место для текстового запроса и вложений; дост
