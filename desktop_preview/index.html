<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ef">
  <title>Ватэс AI — рабочее пространство</title>
  <style>
    /* Все стили и значки встроены: этот макет работает без интернета и установки. */
    :root { color-scheme: light; --bg:#f7f7f2; --side:#eeefe8; --panel:#fff; --text:#202b27; --muted:#727c76; --line:#dde2d9; --green:#255c49; --soft:#e4eee6; --accent:#d2e69c; --orange:#aa6244; --shadow:0 12px 40px #23392b08; font-family:"Segoe UI",Arial,sans-serif; }
    [data-theme="dark"] { color-scheme:dark; --bg:#171e1b; --side:#121915; --panel:#202923; --text:#e4eadf; --muted:#a0ada2; --line:#344138; --green:#a6d1ac; --soft:#2a3c30; --accent:#bace8f; --orange:#e4ac83; --shadow:none; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-size:14px; line-height:1.55; }
    button,input,select,textarea { font:inherit; }
    button,a,input,select,textarea { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.5; }
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid #8ba96c; outline-offset:4px; }
    a { color:var(--green); text-underline-offset:3px; }
    button { color:inherit; }
    button svg, a svg { flex-shrink:0; }
    svg.icon { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
    h1,h2,h3,p { margin-top:0; }
    h1 { font-weight:500; font-size:40px; line-height:1.2; letter-spacing:-1.7px; margin-bottom:18px; }
    h2 { font-weight:550; font-size:21px; letter-spacing:-.5px; margin-bottom:8px; }
    h3 { font-weight:600; font-size:15px; margin-bottom:7px; }
    p { margin-bottom:14px; }
    .muted { color:var(--muted); }
    .tiny { font-size:12px; }
    .mono { font-family:Consolas,"Courier New",monospace; }
    .hidden,[hidden] { display:none!important; }
    .shell { display:grid; grid-template-columns:238px minmax(0,1fr); min-height:100vh; }
    .sidebar { position:sticky; top:0; height:100vh; padding:30px 18px 20px; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:20; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 10px; text-decoration:none; color:var(--text); margin-bottom:34px; }
    .brand-symbol { width:34px; height:34px; color:var(--green); }
    .brand-name { font-size:23px; letter-spacing:-1px; font-weight:650; }
    .brand-name span { font-size:12px; font-weight:500; letter-spacing:1px; margin-left:5px; color:var(--green); }
    .btn { min-height:41px; padding:10px 17px; border:1px solid var(--line); border-radius:9px; background:var(--panel); display:inline-flex; align-items:center; justify-content:center; gap:9px; font-size:13px; font-weight:550; text-decoration:none; transition:background .15s,transform .15s; }
    .btn:hover:not(:disabled) { background:var(--soft); transform:translateY(-1px); }
    .btn.primary { background:var(--green); color:var(--panel); border-color:var(--green); }
    .btn.primary:hover:not(:disabled) { filter:brightness(1.12); background:var(--green); }
    .btn.accent { background:var(--accent); color:#27392a; border-color:transparent; }
    .btn.ghost { background:transparent; border-color:transparent; }
    .btn.small { min-height:32px; padding:6px 10px; font-size:12px; }
    .btn.square { padding:9px; width:39px; height:39px; }
    .new-chat { width:100%; justify-content:flex-start; margin-bottom:27px; background:var(--panel); }
    .nav-label { padding:0 12px; color:var(--muted); font-size:10px; letter-spacing:1.7px; text-transform:uppercase; margin:0 0 9px; font-weight:600; }
    .nav { display:grid; gap:5px; }
    .nav button { display:flex; align-items:center; text-align:left; gap:12px; padding:11px 12px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:13px; }
    .nav button:hover { background:var(--soft); color:var(--text); }
    .nav button.active { background:var(--soft); color:var(--green); font-weight:650; }
    .nav .count { margin-left:auto; background:var(--panel); padding:1px 6px; border-radius:4px; font-size:10px; }
    .history-label { margin-top:28px; }
    .history { display:grid; gap:3px; max-height:160px; overflow:auto; }
    .history button { background:transparent; border:0; border-radius:6px; padding:8px 12px; text-align:left; color:var(--muted); white-space:nowrap; text-overflow:ellipsis; overflow:hidden; font-size:12px; }
    .history button:hover { background:var(--soft); color:var(--text); }
    .sidebar-bottom { margin-top:auto; padding-top:22px; }
    .local-note { padding:15px 12px; border-top:1px solid var(--line); margin-top:18px; font-size:11px; color:var(--muted); display:flex; gap:9px; align-items:flex-start; }
    .profile { display:flex; align-items:center; gap:10px; padding:10px 11px 0; }
    .avatar { width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line); background:var(--panel); border-radius:50%; font-size:11px; font-weight:650; }
    .workspace { min-width:0; }
    .topbar { height:83px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:14px; padding:0 42px; }
    .crumb { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12px; }
    .crumb strong { color:var(--text); font-weight:500; }
    .top-actions,.row { display:flex; align-items:center; gap:12px; }
    .row.wrap { flex-wrap:wrap; }
    .between { justify-content:space-between; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; font-size:10px; border-radius:5px; border:1px solid var(--line); white-space:nowrap; color:var(--muted); }
    .pill.good { color:var(--green); background:var(--soft); border-color:transparent; }
    .pill.warm { color:var(--orange); border-color:transparent; background:#bf875515; }
    .dot { height:6px; width:6px; display:inline-block; border-radius:50%; background:currentColor; }
    .page { max-width:1320px; margin:auto; padding:36px 42px 28px; }
    .eyebrow { color:var(--green); font-size:10px; font-weight:650; letter-spacing:2px; text-transform:uppercase; margin-bottom:15px; }
    .page-head { margin-bottom:26px; }
    .page-head h1 { font-size:32px; letter-spacing:-1px; margin-bottom:10px; }
    .page-head p { color:var(--muted); max-width:720px; }
    .home-layout { display:grid; grid-template-columns:minmax(0,1fr) 272px; gap:32px; }
    .welcome { padding-top:28px; }
    .welcome p { color:var(--muted); max-width:530px; line-height:1.75; }
    .welcome h1 em { font-family:Georgia,serif; font-weight:normal; color:var(--green); }
    .greeting-icon { color:var(--green); margin-bottom:22px; width:43px; height:43px; }
    .composer { margin-top:28px; border:1px solid var(--line); background:var(--panel); box-shadow:var(--shadow); border-radius:15px; padding:19px 18px 13px; }
    .composer:focus-within { border-color:#7d9c80; box-shadow:0 0 0 3px #6e92700c; }
    .composer textarea { resize:vertical; width:100%; min-height:80px; max-height:260px; border:0; background:transparent; color:var(--text); padding:0; outline:none; font-size:14px; }
    .composer textarea:focus-visible { outline:none; }
    .composer textarea::placeholder { color:var(--muted); }
    .composer-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
    .composer select { border:0; background:transparent; color:var(--muted); font-size:11px; padding:5px; max-width:160px; }
    .send { width:37px; height:37px; border:0; border-radius:9px; background:var(--green); color:var(--panel); display:grid; place-items:center; }
    .hint { text-align:center; font-size:10px; color:var(--muted); margin:10px 0 31px; }
    .suggestions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:13px; }
    .suggestion { text-align:left; padding:17px 14px; min-height:115px; border:1px solid var(--line); border-radius:11px; background:transparent; transition:background .15s; }
    .suggestion:hover { background:var(--panel); }
    .suggestion .icon { color:var(--green); margin-bottom:10px; }
    .suggestion strong { font-size:12px; display:block; font-weight:550; }
    .suggestion span { color:var(--muted); font-size:11px; display:block; margin-top:5px; }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:15px; }
    .section-title h2 { font-size:15px; margin:0; font-weight:600; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:22px; box-shadow:var(--shadow); }
    .card + .card { margin-top:16px; }
    .card.soft { background:var(--soft); box-shadow:none; }
    .card.dark { background:#254d3c; color:#eef4e8; border:0; position:relative; overflow:hidden; }
    .card.dark .muted { color:#bfd0bc; }
    .card.dark .pill { border-color:#ffffff29; color:#d5e2cc; }
    .card.dark .btn { color:#24432e; background:#d3e3b3; border:0; }
    .stat-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); font-size:12px; }
    .stat-row:last-child { border:0; }
    .status-icon { width:37px; height:37px; display:grid; place-items:center; border:1px solid var(--line); border-radius:10px; margin-bottom:15px; color:var(--green); }
    .rail { padding-top:10px; }
    .rail h2 { font-size:15px; }
    .rail p { font-size:12px; }
    .rail .btn { width:100%; margin-top:15px; }
    .rail .stat-row { font-size:11px; }
    .mini-art { width:100%; height:96px; margin:2px 0 12px; }
    .footer { margin-top:36px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; display:flex; justify-content:space-between; gap:12px; }
    .demo-banner { font-size:12px; padding:13px 16px; background:var(--soft); border:1px solid var(--line); border-radius:9px; color:var(--green); margin-bottom:24px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .grid-2 > .card,.grid-3 > .card { margin:0; }
    .metric { font-size:30px; font-weight:550; letter-spacing:-1px; margin:4px 0; }
    .label { display:block; font-size:12px; font-weight:550; margin:15px 0 7px; }
    .field { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
    textarea.field { min-height:160px; resize:vertical; }
    .code { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:14px; overflow-wrap:anywhere; white-space:pre-wrap; font-size:12px; }
    .log { background:#19271f; color:#c5d5c3; font-family:Consolas,monospace; font-size:12px; padding:18px; border-radius:9px; max-height:240px; overflow:auto; white-space:pre-wrap; }
    .steps { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:25px; }
    .step { color:var(--muted); font-size:11px; border-top:2px solid var(--line); padding-top:12px; }
    .step.active { color:var(--green); border-color:var(--green); }
    .step b { display:block; margin-top:3px; font-size:12px; }
    .dropzone { border:1px dashed #96aa97; background:var(--bg); padding:25px 16px; text-align:center; border-radius:9px; }
    .dropzone .icon { width:29px; height:29px; margin-bottom:12px; color:var(--green); }
    .dropzone input { width:100%; font-size:12px; margin-top:12px; }
    progress { width:100%; height:10px; accent-color:var(--green); }
    .progress-wrap { margin:20px 0; }
    .chart { width:100%; height:155px; color:var(--green); }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { color:var(--muted); font-weight:500; text-align:left; font-size:11px; }
    th,td { padding:13px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    tr:last-child td { border-bottom:0; }
    .message-list { display:grid; gap:18px; padding:8px 0; }
    .message { max-width:90%; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:16px 18px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .message.user { margin-left:auto; background:var(--soft); }
    .message-meta { color:var(--muted); font-size:10px; margin-bottom:7px; }
    .message-text { font-size:14px; line-height:1.7; }
    .message-actions { display:flex; gap:6px; margin-top:12px; }
    .file-chip { font-size:11px; color:var(--green); background:var(--soft); padding:5px 9px; border-radius:5px; display:inline-flex; gap:8px; margin-bottom:10px; }
    .empty { text-align:center; padding:40px 20px; color:var(--muted); }
    .tabs { display:flex; flex-wrap:wrap; gap:7px; margin:20px 0; }
    .tabs button { border:1px solid var(--line); border-radius:7px; padding:7px 12px; background:transparent; font-size:12px; }
    .tabs button.active { background:var(--green); color:var(--panel); border-color:var(--green); }
    .research-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
    .research-card { display:flex; flex-direction:column; gap:10px; padding:20px; }
    .research-grid > .card { margin:0; }
    .research-card h3 { font-size:16px; margin:0; }
    .research-card p { margin:0; font-size:12px; }
    .research-card .source { margin-top:auto; font-size:11px; }
    .recommendation { border-left:2px solid #9ab57c; padding-left:12px; color:var(--green); }
    .checkline { display:flex; align-items:flex-start; gap:10px; margin:16px 0; font-size:13px; }
    .checkline input { margin-top:4px; accent-color:var(--green); }
    .version-name { font-weight:600; color:var(--text); }
    dialog { border:1px solid var(--line); border-radius:15px; background:var(--panel); color:var(--text); padding:28px; max-width:500px; width:calc(100% - 32px); box-shadow:0 20px 80px #0003; }
    dialog::backdrop { background:#15251d55; backdrop-filter:blur(3px); }
    dialog p { color:var(--muted); font-size:13px; }
    .toast { position:fixed; bottom:25px; left:50%; transform:translateX(-50%); max-width:min(520px,90vw); background:var(--text); color:var(--panel); padding:13px 20px; border-radius:9px; box-shadow:0 8px 30px #0002; z-index:100; font-size:13px; }
    .mobile-menu { display:none; }
    .spacer { height:22px; }
    details { font-size:12px; color:var(--muted); margin-top:16px; }
    summary { cursor:pointer; margin-bottom:10px; color:var(--text); }
    .notice-error { color:#b34739; font-size:12px; margin-top:10px; }
    @media(min-width:1500px) { .page { padding-top:50px; } .welcome { padding-top:52px; } .home-layout { gap:52px; } h1 { font-size:47px; } }
    @media(max-width:1190px) { .shell { grid-template-columns:210px minmax(0,1fr); } .page { padding:28px; } .topbar { padding:0 28px; } .home-layout { grid-template-columns:minmax(0,1fr) 238px; gap:22px; } h1 { font-size:34px; } .suggestions { grid-template-columns:1fr; } .suggestion { min-height:0; padding:13px; } .suggestion .icon { float:left; margin:3px 12px 0 0; } }
    @media(max-width:950px) { .home-layout { grid-template-columns:1fr; } .rail { display:grid; grid-template-columns:1fr 1fr; gap:15px; } .rail > .card { margin:0; } .grid-3 { grid-template-columns:1fr; } .suggestions { grid-template-columns:repeat(3,minmax(0,1fr)); } .suggestion .icon { float:none; margin:0 0 10px; } .topbar .crumb > span { display:none; } .research-grid { grid-template-columns:1fr; } }
    @media(max-width:700px) { .shell { display:block; } .sidebar { position:fixed; left:0; width:248px; transform:translateX(-100%); transition:transform .2s; height:100dvh; box-shadow:20px 0 60px #0002; } body.menu-open .sidebar { transform:translateX(0); } .mobile-menu { display:inline-flex; } .topbar { height:67px; padding:0 16px; } .top-actions { gap:5px; } .topbar .pill { font-size:9px; padding:4px 6px; } .page { padding:24px 18px; } .welcome { padding-top:12px; } h1 { font-size:35px; } .grid-2 { grid-template-columns:1fr; } .rail { grid-template-columns:1fr; } .suggestions { grid-template-columns:1fr; } .suggestion .icon { float:left; margin:3px 12px 0 0; } .page-head h1 { font-size:28px; } .steps { gap:7px; } .step b { font-size:10px; } .composer-bottom { gap:3px; } .composer .row { gap:1px; } .composer select { max-width:130px; } .message { max-width:100%; } .footer { flex-wrap:wrap; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <!-- Собственные SVG-символы заменяют эмодзи и внешние библиотеки иконок. -->

  <div class="shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#chat"><svg class="brand-symbol"><use href="#i-brand"/></svg><span class="brand-name">ватэс<span>AI</span></span></a>
      <button class="btn new-chat" id="new-chat"><svg class="icon"><use href="#i-plus"/></svg>Новый диалог</button>
      <p class="nav-label">Рабочее пространство</p>
      <nav class="nav" id="main-nav">
        <button data-page="chat" class="active"><svg class="icon"><use href="#i-chat"/></svg>Чат с Ватэс</button>

vidence":"Официальная витрина и описания сценариев","source":"https://www.photoroom.com/","priority":"P2"},{"id":39,"name":"Pixelcut","category":"Медиа","visual":"Простой первый экран, разделы Edit / Generate / API; на странице есть примеры до и после.","feature":"Удаление фона, улучшение изображений и творческие рабочие процессы.","idea":"Использовать сравнение «до / после» для правок текста и результатов модели.","evidence":"Официальная витрина и примеры","source":"https://www.pixelcut.ai/","priority":"P1"},{"id":40,"name":"Poe","category":"Ассистенты","visual":"Открывается компактная форма входа; рабочий каталог моделей без входа не доступен.","feature":"Входная страница заявляет общение с разными моделями и групповые чаты.","idea":"Гипотеза: единый интерфейс выбора наших специализированных компонентов, с простым описанием назначения каждого.","evidence":"Только официальный экран входа","source":"https://poe.com/","priority":"P2"},{"id":41,"name":"Polybuzz","category":"Персонажи","visual":"Карточки профилей, категория и теги; каталог отделён от создания персонажа.","feature":"Открытый каталог персонажей и действия создания профиля; диалоги не тестировались.","idea":"Для деловых ролей использовать короткие карточки с назначением и ограничениями; не превращать главное окно в бесконечную ленту.","evidence":"Публичный каталог; без диалогов","source":"https://www.polybuzz.ai/","priority":"P2"},{"id":42,"name":"Quark","category":"Ассистенты","visual":"Светлая витрина с вкладками возможностей и отдельной кнопкой настольного приложения.","feature":"ИИ-браузер, поиск, помощник, чтение страниц, перевод и работа с файлами заявлены на странице.","idea":"Позже — компактная панель помощника для выбранного текста; сначала сделать надёжную работу в собственном окне.","evidence":"Официальная витрина; приложение не устанавливалось","source":"https://quark.cn/","priority":"P2"},{"id":43,"name":"QuillBot","category":"Работа","visual":"Левая панель инструментов; быстрые режимы рядом с вводом. Часть экрана закрывал баннер cookie.","feature":"Перефразирование, проверка текста, перевод, краткое изложение и работа с цитатами.","idea":"Короткие действия над выделенным текстом: упростить, сократить, объяснить; сохранять исходный вариант.","evidence":"Открытая оболочка и список инструментов","source":"https://quillbot.com/","priority":"P1"},{"id":44,"name":"Qwen","category":"Ассистенты","visual":"Светлый минималистичный входной экран с крупным полем запроса; часть элементов первоначально была в загрузке.","feature":"На сайте отдельно представлены веб-приложение, настольные приложения и API-платформа.","idea":"Чётко разделить чат пользователя и управление API, сохранив один стиль и понятную навигацию.","evidence":"Частично загруженная официальная витрина","source":"https://qwen.ai/","priority":"P0"},{"id":45,"name":"Remove.bg","category":"Медиа","visual":"Основной редактор загрузился неполно; в доступном тексте акцент на одной конкретной операции.","feature":"Автоматическое удаление фона изображения; интеграции и API перечислены на странице.","idea":"Один экран — одна понятная задача. Перед запуском объяснять ожидаемый результат и формат файла.","evidence":"Публичное описание; визуал ограничен загрузкой","source":"https://www.remove.bg/","priority":"P1"},{"id":46,"name":"SeaArt","category":"Медиа","visual":"Тёмное пространство, вкладки типов результата, крупный ввод и готовые сценарии.","feature":"Изображения, видео, шаблоны и повторное использование творческих примеров.","idea":"Библиотека своих проверенных сценариев с кнопкой «Использовать как основу».","evidence":"Открытая витрина и каталог","source":"https://www.seaart.ai/","priority":"P2"},{"id":47,"name":"SpicyChat","category":"Персонажи","visual":"Не оценён: инструмент получил только минимальные метаданные страницы.","feature":"Присутствие в выборке подтверждено; функциональность в этой проверке не подтверждена.","idea":"Не включать конкретные решения в план без доступного интерфейса.","evidence":"Минимальные метаданные; UX не проверен","source":"https://a16z.com/100-gen-ai-apps-6/","sourceLabel":"Источник включения в выборку","priority":"HOLD"},{"id":48,"name":"Suno","category":"Медиа","visual":"Тёплая цветная музыкальная витрина; динамическая часть первого экрана загружалась неполно.","feature":"Официальное описание: создание музыки из короткой идеи, текста или аудио.","idea":"Предлагать несколько простых способов начать работу; музыкальную генерацию оставить вне ближайшего плана.","evidence":"Официальное описание + частичный визуал","source":"https://suno.com/","priority":"P2"},{"id":49,"name":"TurboScribe","category":"Работа","visual":"Контрастный синий экран показывает цепочку: загрузить аудио → получить текст → экспортировать.","feature":"Преобразование аудио и видео в текст; на иллюстрации видны форматы экспорта.","idea":"Для будущих голосовых заметок добавить расшифровку с последующим редактированием и экспортом.","evidence":"Официальная витрина с примером результата","source":"https://turboscribe.ai/","priority":"P2"},{"id":50,"name":"VEED","category":"Медиа","visual":"Переключатели создания/редактирования, поле запроса и карточки персонажей; яркий акцент на действии.","feature":"ИИ-видео и редактирование собраны в единый сценарий.","idea":"Разделить «Создать новое» и «Изменить существующее», чтобы пользователь понимал, что произойдёт с его материалом.","evidence":"Официальная витрина; редактор не тестировался","source":"https://www.veed.io/","priority":"P2"}]</script>
  <script>
    'use strict';
    // Сценарии макета не запускают процессы и не обращаются к рабочим весам модели.
    const APP_KEY = 'vates-desktop-preview-v1';
    const $ = (selector, root = document) => root.querySelector(selector);
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const state = {
      page: 'chat', theme: 'light', chats: [], activeChat: null, files: [],
      api: 'stopped', apiLogs: ['[макет] Сервер не запущен. Нажмите кнопку демонстрации.'],
      training: { phase: 'empty', records: [], errors: [], source: '', progress: 0, epoch: 0, epochs: 5, candidate: null },
      versions: [{ id: 'demo-base', name: 'Базовая версия · пример', created: 'Исходное состояние макета', score: '—', active: true }],
      settings: { name: 'Ватэс', remember: true }, researchFilter: 'Все', researchSearch: '', favorites: []
    };
    let timer = null;
    let apiTimer = null;
    let toastTimer = null;
    let draftText = '';
    let attachment = null;
    const research = JSON.parse($('#research-data').textContent);
    const pageNames = {chat:'Чат с Ватэс', library:'Мои материалы', api:'Локальный API', training:'Обучение', versions:'Версии модели', research:'Обзор ИИ', settings:'Настройки'};

    // Браузер может запретить localStorage для file://. Тогда макет продолжает работать в памяти.
    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem(APP_KEY) || 'null');
        if (!saved || typeof saved !== 'object') return;
        state.theme = saved.theme === 'dark' ? 'dark' : 'light';
        if (saved.settings && typeof saved.settings.name === 'string') state.settings = {name:saved.settings.name.slice(0,30), remember:saved.settings.remember !== false};
        if (state.settings.remember && Array.isArray(saved.chats)) {
          state.chats = saved.chats.filter(c => typeof c.id === 'string' && typeof c.title === 'string' && Array.isArray(c.messages)).slice(0,30).map(c => ({id:c.id,title:c.title.slice(0,80),messages:c.messages.filter(m => typeof m.text === 'string' && ['user','assistant'].includes(m.role)).slice(-80).map(m => ({role:m.role,text:m.text.slice(0,10000),feedback:m.feedback === true}))}));
        }
        state.favorites = Array.isArray(saved.favorites) ? saved.favorites.filter(n => Number.isInteger(n)) : [];
      } catch (error) { toast('История недоступна. Можно продолжить без сохранения.'); }
    }
    function persist() {
      try { localStorage.setItem(APP_KEY, JSON.stringify({theme:state.theme, settings:state.settings, chats:state.settings.remember ? state.chats.slice(0,30) : [], favorites:state.favorites})); }
      catch (error) { toast('Браузер не сохранил историю. Экспортируйте важный диалог.'); }
    }
    function toast(text) {
      clearTimeout(toastTimer); $('#toast').textContent = text; $('#toast').classList.remove('hidden');
      toastTimer = setTimeout(() => $('#toast').classList.add('hidden'), 4300);
    }
    function dialog(title, html) { $('#dialog-title').textContent = title; $('#dialog-body').innerHTML = html; $('#info-dialog').showModal(); }
    function footer() { return '<footer class="footer"><span>Ватэс AI · своё пространство, свой ритм</span><span>Прототип интерфейса / 01.10.2026</span></footer>'; }
    function demoBanner(text) { return `<div class="demo-banner">${icon('spark')} ${text}</div>`; }
    function head(label, title, text) { return `<div class="page-head"><div class="eyebrow">${label}</div><h1>${title}</h1><p>${text}</p></div>`; }
    function navigate(page, preserveDraft = true) {
      if (!pageNames[page]) page = 'chat';
      const composer = $('#prompt'); if (composer && preserveDraft) draftText = composer.value;
      state.page = page; location.hash = page;
      document.body.classList.remove('menu-open'); $('#menu-toggle').setAttribute('aria-expanded','false'); render();
    }
    function renderHistory() {
      $('#history').innerHTML = state.chats.length ? state.chats.slice(0,5).map(c => `<button data-chat="${escapeHtml(c.id)}" title="${escapeHtml(c.title)}">${escapeHtml(c.title)}</button>`).join('') : '<span class="muted tiny" style="padding:7px 12px">Здесь появятся твои диалоги</span>';
    }
    function render() {
      document.documentElement.dataset.theme = state.theme;
      $('#breadcrumb').textContent = pageNames[state.page];
      document.querySelectorAll('[data-page]').forEach(button => { const active = button.dataset.page === state.page; button.classList.toggle('active',active); if (active) button.setAttribute('aria-current','page'); else button.removeAttribute('aria-current'); });
      const views = {chat:chatView, library:libraryView, api:apiView, training:trainingView, versions:versionsView, research:researchView, settings:settingsView};
      $('#page-content').innerHTML = views[state.page]() + footer();
      renderHistory(); bindPage();
    }
    function chatView() {
      const chat = state.chats.find(c => c.id === state.activeChat);

      if (file) return `Вложен файл «${file.name}» (${file.text.length} символов). Он прочитан только в этом браузере.\n\nВот начало текста:\n${file.text.slice(0,500)}\n\nЭто демонстрация просмотра вложения. Анализ нейросетью здесь ещё не выполняется.`;
      if (/api|апи|сервер/.test(query)) return 'API — это вход для других программ в твоего ИИ. Например, сайт отправляет вопрос, а сервер возвращает ответ.\n\nВ будущем приложении ты нажмёшь «Запустить API», оно загрузит модель и проверит готовность. Только после проверки появится статус «Работает».\n\nОткрой «Локальный API», чтобы попробовать этот сценарий. Здесь он демонстрационный.';
      if (/обуч|нейросет|модел/.test(query)) return 'Предлагаю идти по шагам:\n\n1. Выбрать одну задачу для улучшения.\n2. Собрать и проверить хорошие примеры.\n3. Отделить обучающие данные от проверочных.\n4. Обучить новую версию отдельно от рабочей.\n5. Сравнить ответы и только затем применить результат.\n\nВ разделе «Обучение» можно пройти сокращённую демонстрацию. Она не запускает настоящее обучение.';
      if (/обзор|50|иде[яиюй]|продукт/.test(query)) return 'Для Ватэс я бы выбрал четыре направления:\n\n• Чистый чат и понятные режимы работы.\n• Материалы и диалоги внутри одного проекта.\n• Источники рядом с ответом, когда подключим поиск по документам.\n• Наглядные этапы задачи и обратимые изменения.\n\nОткрой «Обзор ИИ»: там можно искать продукты и отмечать полезные идеи.';
      if (mode === 'plan') return 'Пример структуры плана:\n\n1. Записать ожидаемый результат одним предложением.\n2. Разделить работу на три небольших шага.\n3. Выбрать самый простой первый шаг.\n4. Проверить результат на реальном примере.\n\nЭтот ответ подготовлен для макета и не является анализом твоей задачи.';
      if (mode === 'explain') return 'В режиме «Объясни просто» помощник должен давать короткое определение, знакомый пример и один следующий шаг.\n\nСейчас показан шаблон такого ответа. Чтобы объяснять именно твою тему, потребуется подключить локальную нейросеть.';
      return 'Сообщение получено. Этот макет помогает проверить, удобно ли общаться с Ватэс. Свободные ответы настоящего ИИ здесь ещё не подключены.\n\nПопробуй спросить про API, обучение нейросети или идеи из обзора 50 продуктов — для этих тем подготовлены демонстрационные ответы.';
    }
    function sendMessage(event) {
      event.preventDefault();
      const prompt = $('#prompt').value.trim();
      if (!prompt && !attachment) return toast('Напиши сообщение или прикрепи текстовый файл.');
      const mode = $('#chat-mode').value;
      let chat = state.chats.find(c => c.id === state.activeChat);
      if (!chat) {
        chat = {id:`chat-${Date.now()}-${Math.random().toString(16).slice(2,8)}`,title:(prompt || attachment.name).slice(0,55),messages:[]};
        state.chats.unshift(chat); state.chats = state.chats.slice(0,30); state.activeChat = chat.id;
      }
      chat.messages.push({role:'user',text:prompt + (attachment ? `\nФайл: ${attachment.name}` : '')});
      chat.messages.push({role:'assistant',text:demoReply(prompt,mode,attachment),feedback:false});
      chat.messages = chat.messages.slice(-80); draftText = ''; attachment = null; persist(); render(); $('#prompt').focus();
    }
    async function readMaterial(file, forChat) {
      if (!file) return;
      try {
        if (!/\.(txt|md)$/i.test(file.name)) throw new Error('Выбери текстовый файл .txt или .md.');
        if (file.size > 1024*1024) throw new Error('Файл больше 1 МБ. Для макета нужен небольшой текст.');
        const text = await file.text();
        if (!text.trim()) throw new Error('Файл пуст. Выбери файл с текстом.');
        const material = {name:file.name,size:file.size,text};
        if (forChat) { const prompt = $('#prompt'); if (prompt) draftText = prompt.value; attachment = material; }
        else { if (state.files.length >= 20) throw new Error('В макете можно открыть до 20 материалов за сессию.'); state.files.push(material); }
        render(); toast(forChat ? 'Файл добавлен к сообщению.' : 'Материал прочитан локально.');
      } catch (error) { toast(error.message || 'Не удалось прочитать файл.'); }
    }
    function sampleData() {
      const pairs = [
        ['Что такое API?','Интерфейс обмена данными между программами.'],
        ['Зачем нужен сервер?','Сервер принимает запросы и возвращает результат.'],
        ['Что такое обучение?','Настройка параметров модели на подготовленных примерах.'],
        ['Что такое датасет?','Набор примеров для обучения или проверки.'],
        ['Как сохранить результат?','Запиши новую модель в отдельную версию.'],
        ['Зачем проверять модель?','Чтобы увидеть качество на новых примерах.'],
        ['Что такое JSON?','Текстовый формат хранения структурированных данных.'],
        ['Что такое HTML?','Язык разметки веб-страниц.'],
        ['Что такое CSS?','Язык оформления веб-страниц.'],
        ['Что делает кнопка?','Запускает действие после нажатия.'],
        ['Как вернуть модель?','Выбери предыдущую проверенную версию.'],
        ['Зачем сохранять журнал?','Чтобы понять, что происходило во время работы.']
      ];
      setDataset(pairs.map(([prompt,completion]) => ({prompt,completion})),'Встроенный демо-набор · 12 примеров');
    }
    function setDataset(records, source) {
      state.training = {phase:'loaded',records,source,errors:[],progress:0,epoch:0,epochs:state.training.epochs,candidate:null};
      render(); toast('Набор добавлен. Теперь проверь его структуру.');
    }
    async function importDataset(file) {
      if (!file) return;
      try {
        if (!/\.(json|jsonl)$/i.test(file.name)) throw new Error('Поддерживаются только .json и .jsonl.');
        if (file.size > 2*1024*1024) throw new Error('Набор больше 2 МБ. Используй небольшой фрагмент.');
        const content = (await file.text()).replace(/^\uFEFF/,'').trim();
        if (!content) throw new Error('Файл пуст.');
        let records;
        if (/\.jsonl$/i.test(file.name)) {
          records = content.split(/\r?\n/).filter(line => line.trim()).map((line,i) => { try { return JSON.parse(line); } catch (error) { throw new Error(`Не удалось прочитать JSON в строке ${i+1}.`); } });
        } else {
          try { records = JSON.parse(content); } catch (error) { throw new Error('JSON повреждён. Проверь скобки, запятые и кавычки.'); }
        }
        if (!Array.isArray(records) || !records.length) throw new Error('JSON должен содержать непустой массив примеров.');
        if (records.length > 5000) throw new Error('В макете можно проверить не более 5 000 примеров.');
        setDataset(records,file.name);
      } catch (error) { toast(error.message || 'Не удалось прочитать набор.'); }
    }
    function validateData() {
      const t = state.training; const errors = []; const seen = new Map();
      t.records.forEach((record,index) => {
        if (!record || typeof record !== 'object' || typeof record.prompt !== 'string' || typeof record.completion !== 'string' || !record.prompt.trim() || !record.completion.trim()) {
          errors.push(`Запись ${index+1}: нужны непустые строки prompt и completion.`); return;
        }
        const key = record.prompt.normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase('ru');
        if (seen.has(key)) errors.push(`Запись ${index+1}: вопрос повторяет запись ${seen.get(key)}.`);
        else seen.set(key,index+1);
      });
      if (t.records.length < 3) errors.push('Для демонстрации нужны хотя бы 3 примера.');
      t.errors = errors.slice(0,8); if (errors.length > 8) t.errors.push(`Ещё ошибок: ${errors.length-8}.`);
      t.phase = errors.length ? 'invalid' : 'ready'; render();
      toast(errors.length ? 'Найдены ошибки. Исходный файл не изменён.' : 'Структура набора подходит для демонстрации.');
    }
    // Таймеры ниже исключительно рисуют сценарий и никогда не запускают обучение.
    function startTraining() {
      const t = state.training;
      if (!['ready','paused'].includes(t.phase) || timer) return;
      t.epochs = Number($('#epochs').value); t.phase = 'running'; render();
      timer = setInterval(() => {
        t.progress = Math.min(100,t.progress+4); t.epoch = Math.min(t.epochs,Math.ceil(t.progress*t.epochs/100));
        if (t.progress >= 100) {
          clearInterval(timer); timer = null; t.phase = 'complete';
          const candidate = {id:`demo-${Date.now()}`,name:`Демо-кандидат ${state.versions.length}`,created:'Создан симуляцией; весов нет',score:'92% · пример',active:false};
          state.versions.push(candidate); t.candidate = candidate.id;
          if (state.page === 'training') render(); toast('Симуляция завершена. Демо-кандидат доступен в версиях.');
        } else if (state.page === 'training') {
          $('#train-progress').value = t.progress; $('#train-percent').textContent = `${t.progress}%`; $('#train-epoch').textContent = `Проход ${t.epoch} из ${t.epochs}`;
        }
      },400);
    }
    function startApi() {
      if (state.api !== 'stopped') return;
      state.api = 'starting'; state.apiLogs.push('[демо] Проверка среды и доступности порта…'); render();
      apiTimer = setTimeout(() => {
        state.api = 'running'; state.apiLogs.push('[демо] Модель загружена: пример статуса.','[демо] Проверка готовности пройдена.','[важно] Настоящий сервер не запускался.'); apiTimer = null;
        if (['api','chat'].includes(state.page)) render(); toast('Демонстрация запуска завершена.');
      },1000);
    }
    function stopApi() {
      clearTimeout(apiTimer); apiTimer = null; state.api = 'stopped'; state.apiLogs.push('[демо] Демонстрационный сервер остановлен.'); render();
    }
    function applyVersion(id) {
      const version = state.versions.find(v => v.id === id); if (!version) return;
      dialog('Сравнение демонстрационных версий', `<p>Выбрана «${escapeHtml(version.name)}». Эти значения придуманы для проверки интерфейса и не описывают качество нейросети.</p><table><tr><th>Критерий</th><th>Базовая</th><th>Кандидат</th></tr><tr><td>Демо-оценка</td><td>88% · пример</td><td>92% · пример</td></tr><tr><td>Файл весов</td><td>Нет</td><td>Нет</td></tr></table><p style="margin-top:15px">В реальном приложении здесь будут ответы на одинаковые вопросы и результаты проверки.</p><button class="btn primary" id="confirm-apply">${id === 'demo-base' ? 'Вернуть базовую версию в макете' : 'Применить только в макете'}</button>`);
      $('#confirm-apply').addEventListener('click',() => { state.versions.forEach(v => v.active = v.id === id); $('#info-dialog').close(); render(); toast('Демонстрационная версия переключена. Рабочая модель не изменялась.'); });
    }
    function bindPage() {
      const on = (selector,event,handler) => { const node = $(selector); if (node) node.addEventListener(event,handler); };
      on('#chat-form','submit',sendMessage);
      on('#prompt','keydown',event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); $('#chat-form').requestSubmit(); } });
      on('#attach-button','click',() => $('#chat-file').click());
      on('#chat-file','change',event => readMaterial(event.target.files[0],true));
      on('#remove-attachment','click',() => { draftText = $('#prompt').value; attachment = null; render(); });
      on('#export-chat','click',() => { const chat = state.chats.find(c => c.id === state.activeChat); download('vates-demo-dialogue.md',`# ${chat.title}\n\nДемонстрационный диалог; ответы не сгенерированы моделью.\n\n` + chat.messages.map(m => `## ${m.role === 'user' ? 'Пользователь' : 'Ватэс · демо'}\n\n${m.text}`).join('\n\n')); });
      on('#api-start','click',startApi); on('#api-stop','click',stopApi);
      on('#copy-address','click',() => copyText('http://127.0.0.1:8000'));
      on('#export-log','click',() => download('vates-demo-api.log',state.apiLogs.join('\n')));
      on('#api-error','click',() => { clearTimeout(apiTimer); apiTimer = null; state.api = 'stopped'; state.apiLogs.push('[пример ошибки] Порт 8000 занят другой программой.','[решение] В полном приложении: выбери другой порт или проверь запущенный сервер.'); render(); });
      on('#library-add','click',() => $('#library-file').click()); on('#library-file','change',event => readMaterial(event.target.files[0],false));
      on('#sample-data','click',sampleData); on('#dataset-file','change',event => importDataset(event.target.files[0]));
      on('#validate-data','click',validateData); on('#epochs','change',event => state.training.epochs = Number(event.target.value));
      on('#train-start','click',startTraining);
      on('#train-pause','click',() => { clearInterval(timer); timer = null; state.training.phase = 'paused'; render(); });
      on('#train-reset','click',() => { clearInterval(timer); timer = null; state.training.phase = 'ready'; state.training.progress = 0; state.training.epoch = 0; render(); });
      on('#settings-theme','click',toggleTheme);
      on('#settings-form','submit',event => { event.preventDefault(); const name = $('#assistant-name').value.trim(); if (!name) return toast('Введи имя помощника.'); state.settings.name = name; state.settings.remember = $('#remember-history').checked; persist(); toast('Настройки сохранены.'); });
      if (state.page === 'research') { renderResearchResults(); on('#research-search','input',event => { state.researchSearch = event.target.value; renderResearchResults(); }); }
    }
    function toggleTheme() {
      const prompt = $('#prompt'); if (prompt) draftText = prompt.value;
      state.theme = state.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = state.theme; persist();
    }
    // Один обработчик обслуживает динамические кнопки, чтобы не плодить подписки.
    document.addEventListener('click',event => {
      const button = event.target.closest('button'); if (!button) return;
      if (button.dataset.page) navigate(button.dataset.page);
      if (button.dataset.chat) { state.activeChat = button.dataset.chat; draftText = ''; attachment = null; navigate('chat',false); }
      if (button.dataset.prompt) { $('#prompt').value = button.dataset.prompt; $('#prompt').focus(); }
      if (button.dataset.copyMessage !== undefined) { const chat = state.chats.find(c => c.id === state.activeChat); if (chat) copyText(chat.messages[Number(button.dataset.copyMessage)].text); }
      if (button.dataset.feedback !== undefined) {
        const chat = state.chats.find(c => c.id === state.activeChat); const index = Number(button.dataset.feedback);
        if (chat) { chat.messages[index].feedback = !chat.messages[index].feedback; draftText = $('#prompt').value; persist(); render(); toast('Оценка сохранена только в макете; обучение не запускается.'); }
      }
      if (button.dataset.filePreview !== undefined) { const file = state.files[Number(button.dataset.filePreview)]; if (file) dialog(file.name,`<pre class="code" style="max-height:360px;overflow:auto">${escapeHtml(file.text.slice(0,20000))}</pre>${file.text.length > 20000 ? '<p>Показаны первые 20 000 символов.</p>' : ''}`); }
      if (button.dataset.apply) applyVersion(button.dataset.apply);
      if (button.dataset.filter) { state.researchFilter = button.dataset.filter; $('#research-tabs').querySelectorAll('button').forEach(b => b.classList.toggle('active',b.dataset.filter === state.researchFilter)); renderResearchResults(); }
      if (button.dataset.favorite) { const id = Number(button.dataset.favorite); state.favorites = state.favorites.includes(id) ? state.favorites.filter(n => n !== id) : [...state.favorites,id]; persist(); renderResearchResults(); }
    });
    $('#new-chat').addEventListener('click',newChat);
    $('#theme-toggle').addEventListener('click',toggleTheme);
    $('#close-dialog').addEventListener('click',() => $('#info-dialog').close());
    $('#menu-toggle').addEventListener('click',() => { const open = document.body.classList.toggle('menu-open'); $('#menu-toggle').setAttribute('aria-expanded',String(open)); });
    document.addEventListener('keydown',event => { if (event.key === 'Escape') { document.body.classList.remove('menu-open'); $('#menu-toggle').setAttribute('aria-expanded','false'); } });
    window.addEventListener('hashchange',() => { const page = location.hash.slice(1); if (pageNames[page] && page !== state.page) navigate(page); });
    window.addEventListener('beforeunload',() => { clearInterval(timer); clearTimeout(apiTimer); });
    restore(); state.page = pageNames[location.hash.slice(1)] ? location.hash.slice(1) : 'chat'; render();
  </script>
</body>
</html>
